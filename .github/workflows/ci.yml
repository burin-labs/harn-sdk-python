name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build twine

      - name: Check version sync
        run: python scripts/check_version_sync.py

      - name: Check generated protocol
        run: python scripts/check_protocol_artifact.py

      - name: Check formatting
        run: ruff format --check src tests scripts examples

      - name: Lint
        run: ruff check src tests scripts examples

      - name: Run tests
        run: pytest -q

      - name: Build package
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Check installed wheel
        run: |
          pip install --force-reinstall dist/*.whl
          python scripts/check_built_package.py

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  ci-status:
    name: CI status
    if: always()
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check commit signatures
        uses: burin-labs/.github/.github/actions/check-commit-signatures@80aff37b3b233bf6498eb4c0c6031d0b5365db86
        with:
          github-token: ${{ github.token }}
      - name: Require successful jobs
        uses: burin-labs/.github/.github/actions/require-successful-needs@80aff37b3b233bf6498eb4c0c6031d0b5365db86
        with:
          results-json: ${{ toJSON(needs.*.result) }}
